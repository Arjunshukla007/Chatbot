<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Python Q&amp;A Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #14151f;
    --panel:     #1b1c29;
    --gutter:    #14151f;
    --border:    #2c2d3d;
    --text:      #d6d8e6;
    --muted:     #6b6d85;
    --prompt:    #61afef;
    --comment:   #7cb87f;
    --accent:    #e5c07b;
    --pink:      #d68fd6;
    --caret:     #e5c07b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 28px 16px;
  }
  .window {
    width: 100%; max-width: 780px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    display: flex; flex-direction: column;
    height: 82vh;
    max-height: 760px;
  }
  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    background: #17182390;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ee6a5f; }
  .dot.y { background: #f4bf4f; }
  .dot.g { background: #61c554; }
  .titlebar .filename {
    margin-left: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }
  .titlebar .tag {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--comment);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .body-wrap { flex: 1; display: flex; min-height: 0; }
  .gutter {
    width: 42px;
    background: var(--gutter);
    border-right: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #3c3d52;
    text-align: right;
    padding: 16px 8px 16px 0;
    overflow: hidden;
    user-select: none;
  }
  .gutter div { line-height: 1.65; height: 20.8px; }
  .transcript {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.65;
  }
  .transcript::-webkit-scrollbar { width: 8px; }
  .transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .line { margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .line .prompt { color: var(--prompt); }
  .line .userline { color: var(--text); }
  .line.answer { color: var(--comment); margin-bottom: 14px; padding-left: 2px; }
  .line.answer .hash { color: #4d6b4f; }
  .line.system { color: var(--muted); font-style: italic; margin-bottom: 14px; }
  .line.confidence { color: var(--muted); font-size: 11px; margin: -8px 0 14px 0; }

  .inputbar {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: #171823;
  }
  .inputbar .prompt {
    font-family: 'JetBrains Mono', monospace;
    color: var(--prompt); font-size: 13.5px; user-select: none;
  }
  .inputbar input {
    flex: 1;
    background: transparent;
    border: none; outline: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    caret-color: var(--caret);
  }
  .inputbar input::placeholder { color: #4a4c60; }
  .inputbar button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #14151f;
    background: var(--accent);
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
  }
  .inputbar button:hover { filter: brightness(1.08); }

  .hint {
    text-align: center;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    margin-top: 12px;
  }
  .hint span { color: var(--accent); }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div class="filename">python_qa_chatbot.py — session</div>
    <div class="tag" id="kb-count">65 topics loaded</div>
  </div>
  <div class="body-wrap">
    <div class="gutter" id="gutter"></div>
    <div class="transcript" id="transcript"></div>
  </div>
  <div class="inputbar">
    <span class="prompt">&gt;&gt;&gt;</span>
    <input id="input" type="text" placeholder="Ask a Python question, e.g. what is a decorator" autocomplete="off">
    <button id="send">Run</button>
  </div>
</div>
<div class="hint">try <span>"what is oop"</span>, <span>"diff between list and tuple"</span>, or <span>topics</span></div>

<script>
const KNOWLEDGE_BASE = JSON.parse(document.getElementById('kb-data').textContent);

const STOPWORDS = new Set(["what","is","the","a","an","are","how","do","you","does",
  "in","of","to","and","or","with","can","i","your","it","this","that",
  "define","explain","tell","me","about"]);

const ALIASES = {
  oop: "object oriented programming", oops: "object oriented programming",
  kwargs: "keyword arguments kwargs", args: "arguments args",
  diff: "difference", py: "python", func: "function", fn: "function",
  var: "variable", vars: "variables", err: "error exception",
  exc: "exception", excep: "exception",
  listcomp: "list comprehension", dictcomp: "dictionary comprehension",
};

const GREETINGS = new Set(["hi","hello","hey","hii","hola","yo"]);
const FAREWELLS = new Set(["bye","goodbye","exit","quit","see you"]);

function preprocess(text) {
  return text.toLowerCase().trim().replace(/[^\w\s]/g, "").replace(/\s+/g, " ");
}
function expandAliases(text) {
  return text.split(" ").map(w => ALIASES[w] || w).join(" ");
}
function keywords(text) {
  text = expandAliases(text);
  return new Set(text.split(" ").filter(w => w.length > 1 && !STOPWORDS.has(w)));
}
function ratio(a, b) {
  // Simple Levenshtein-based similarity ratio, mirrors difflib behaviour closely enough
  const dp = Array.from({length: a.length + 1}, () => new Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  const dist = dp[a.length][b.length];
  return 1 - dist / Math.max(a.length, b.length, 1);
}
function wordSimilar(a, b) {
  if (a === b) return true;
  if (a.length < 4 || b.length < 4) return false;
  return ratio(a, b) >= 0.8;
}
function findBestMatch(userQuestion, cutoff = 0.45) {
  const processed = preprocess(userQuestion);
  if (!processed) return [null, null, 0];
  const userKw = keywords(processed);
  if (userKw.size === 0) return [null, null, 0];

  let bestQ = null, bestScore = 0;
  for (const q of Object.keys(KNOWLEDGE_BASE)) {
    const qKw = keywords(q);
    if (qKw.size === 0) continue;
    let hits = 0;
    for (const uw of userKw) {
      let matched = false;
      for (const qw of qKw) { if (wordSimilar(uw, qw)) { matched = true; break; } }
      if (matched) hits++;
    }
    if (hits === 0) continue;
    const recall = hits / userKw.size;
    const precision = hits / qKw.size;
    const score = 2 * recall * precision / (recall + precision);
    if (score > bestScore) { bestScore = score; bestQ = q; }
  }
  if (bestQ && bestScore >= cutoff) return [bestQ, KNOWLEDGE_BASE[bestQ], bestScore];
  return [null, null, bestScore];
}

function getResponse(userInput) {
  const processed = preprocess(userInput);
  if (!processed) return "Please type a question — I'm ready when you are!";
  if (GREETINGS.has(processed)) return "Hello! I'm your Python Q&A assistant. Ask me anything about Python programming.";
  if (processed.startsWith("thank")) return "You're welcome! Ask me anything else about Python.";
  if (FAREWELLS.has(processed)) return "Goodbye! Happy coding.";
  const [, answer] = findBestMatch(userInput);
  if (answer) return answer;
  return "I'm not sure about that one yet — my knowledge base doesn't cover it. Try asking about Python basics, data types, functions, OOP, exceptions, or modules.";
}

// --- UI wiring ---
const transcript = document.getElementById('transcript');
const gutter = document.getElementById('gutter');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
document.getElementById('kb-count').textContent = Object.keys(KNOWLEDGE_BASE).length + ' topics loaded';

let lineNo = 0;
function addGutterLines(n) {
  for (let i = 0; i < n; i++) {
    lineNo++;
    const d = document.createElement('div');
    d.textContent = lineNo;
    gutter.appendChild(d);
  }
}

function addUserLine(text) {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = `<span class="prompt">&gt;&gt;&gt; </span><span class="userline"></span>`;
  div.querySelector('.userline').textContent = text;
  transcript.appendChild(div);
  addGutterLines(1);
}

function addBotLine(text, confidence) {
  const wrapLines = text.split("\n");
  wrapLines.forEach((wl, idx) => {
    const div = document.createElement('div');
    div.className = 'line answer';
    div.innerHTML = `<span class="hash"># </span>`;
    div.appendChild(document.createTextNode(wl));
    transcript.appendChild(div);
  });
  addGutterLines(wrapLines.length);
  transcript.lastChild.style.marginBottom = '14px';
}

function addSystemLine(text) {
  const div = document.createElement('div');
  div.className = 'line system';
  div.textContent = text;
  transcript.appendChild(div);
  addGutterLines(1);
}

function scrollDown() { transcript.scrollTop = transcript.scrollHeight; }

function handleTopics() {
  addSystemLine('# Sample topics you can ask about:');
  Object.keys(KNOWLEDGE_BASE).sort().forEach(q => addSystemLine('#   - ' + q));
}

function send() {
  const text = input.value.trim();
  if (!text) return;
  addUserLine(text);
  input.value = '';

  if (text.toLowerCase() === 'topics') {
    handleTopics();
    scrollDown();
    return;
  }

  const response = getResponse(text);
  addBotLine(response);
  scrollDown();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Welcome message
addSystemLine('# Python Q&A Chatbot ready. Type a question below, or "topics" to browse.');
addBotLine("Hi! I'm your Python Q&A assistant. Ask me anything about Python programming.");
input.focus();
</script>
